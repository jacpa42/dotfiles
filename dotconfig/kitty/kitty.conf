#
# Options
#
scrollback_pager nvim +"source ~/.config/kitty/vi-mode.lua"
scrollbar never
sync_to_monitor yes
enable_audio_bell no
wayland_titlebar_color system
linux_display_server wayland
enabled_layouts splits

active_border_color #c1c1c1
inactive_border_color #000000
bell_border_color #000000

#
# Cursor
#
cursor_shape block
cursor_shape_unfocused hollow
shell_integration no-cursor
cursor_blink_interval 0
cursor_trail 0
cursor_trail_decay 0.1 0.2

#
# Keymaps
#
map alt+escape show_scrollback
map alt+c new_tab_with_cwd
map alt+e previous_tab
map alt+r next_tab

map alt+n combine | clear_terminal scroll active | clear_terminal scrollback active

map alt+v launch --cwd=current --location=vsplit

map alt+shift+h move_window left
map alt+shift+j move_window down
map alt+shift+k move_window up
map alt+shift+l move_window right

map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right

map alt+b launch --cwd=current --type=tab btop
map alt+m launch --cwd=current --type=tab rmpc
map alt+y launch --cwd=current --type=tab yazi
map alt+g launch --cwd=current --type=tab lazygit

#
# Font
#
font_family      family="JetBrainsMono Nerd Font Mono"
font_size        21
bold_font        auto
italic_font      auto
bold_italic_font auto

map ctrl+plus  change_font_size all +1.0
map ctrl+minus change_font_size all -1.0

#
# Tab bar
#
tab_bar_edge top
tab_bar_style slant
tab_bar_align center
tab_bar_min_tabs 3

active_tab_foreground   #7799bb
active_tab_font_style   bold
inactive_tab_foreground #5f7a95
inactive_tab_font_style normal
tab_bar_background none

#
# Colours
#
foreground #c1c1c1
background #000000
background_opacity 0.95

selection_background #c1c1c1
selection_foreground #000000

color0   #1b161e
color1   #333d47
color2   #44515f
color3   #4c5b6b
color4   #999999
color5   #c1c1c1
color6   #999999
color7   #c1c1c1
color8   #5f8787
color9   #aaaaaa
color10  #556677
color11  #7799bb
color12  #aaaaaa
color13  #888888
color14  #999999
color15  #444444
