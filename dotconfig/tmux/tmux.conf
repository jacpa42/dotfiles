unbind C-b
set-option -g prefix M-Space
bind-key M-Space send-prefix

unbind '"'
unbind %

####################################### nvim stuff #######################################

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|nvim?|vim?)(diff)?$'"

bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

##################################### Other Bindings #####################################

bind-key -n M-c new-window -c "#{pane_current_path}"

bind-key v split-window -h -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"

bind-key -n M-g new-window -c "#{pane_current_path}" -n git lazygit

bind-key -n M-Escape copy-mode
bind-key -T copy-mode-vi C-v    send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Escape if-shell -F '#{selection_present}' 'send-keys -X clear-selection' 'send-keys -X cancel'

bind-key r source-file "$HOME/.config/tmux/tmux.conf"

## Clear history ##
bind-key l send-keys -R \; clear-history \; send-keys C-l

##########################################################################################

set-option -g allow-rename off
setw -g mode-keys vi

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase scrollback buffer size from 2000 to 20000 lines
set -g history-limit 20000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 1000

# Refresh 'status-left' and 'status-right' more often
set -g status-interval 15

# Focus events enabled for terminals that support them
set -g focus-events on

set -g automatic-rename off

set -g default-command "$SHELL"
set -g detach-on-destroy off
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",tmux-256color:Tc"
set -ga terminal-overrides ",tmux-256color:Ms@,Xm@,Cs@"

##################################### status bar #####################################

set-option -g status-style bg=default
set-option -g status-position top
set-option -g status-fg color4
set-option -g status-style bg=default,fg=default
set-option -g status-left "#{?client_prefix,#[fg=color5],#[fg=color9]}#{session_name}"
set-option -g status-right-length 99
set-option -g status-left-length 99
set-option -g status-justify absolute-centre

set-option -g window-status-format ' #[bg=default,fg=color9,bold]#W '
set-option -g window-status-current-format '#[bg=default,fg=color9,bold] #[bg=color9,fg=color0,bold]#W#[bg=default,fg=color9,bold] #[fg=default,bg=default]'

set -g status-right '#[fg=color0]雨'

######################################################################################

set-option -g mode-style fg=color11,bg=color0
set-option -g pane-border-style "fg=color0"
set-option -g popup-border-style "fg=color9"
set-option -g pane-active-border-style "fg=color9"
