[main]
font=JetBrainsMono Nerd Font:weight=medium:size=19:fontfeatures=cv11:fontfeatures=ss03:fontfeatures=ss01:fontfeatures=liga, Noto Color Emoji:weight=medium:size=19
dpi-aware=no
match-mode=fzf
icons-enabled=no
terminal='foot -a '{cmd}' -T '{cmd}' {cmd}'
width=60
horizontal-pad=8
vertical-pad=8
render-workers=12
match-workers=12
enable-mouse=false

[colors]
background      = 000000ff #000000ff
text            = 556677ff #556677ff
message         = 7799bbff #7799bbff
prompt          = 7799bbff #7799bbff
placeholder     = 444444ff #444444ff
input           = ffffffff #ffffffff
match           = 7799bbff #7799bbff
selection       = 1b161eff #1b161eff
selection-text  = 556677ff #556677ff
selection-match = 7799bbff #7799bbff
counter         = 000000ff #000000ff
border          = 000000ff #000000ff

[border]
width=0
radius=0
selection-radius=0

[dmenu]
exit-immediately-if-empty=true
